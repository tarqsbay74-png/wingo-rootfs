name: Build glibc

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build inside Ubuntu 24.04 AArch64
        run: |
          chmod +x packages/glibc/build.sh

          docker run --rm \
            --platform linux/arm64 \
            -v "$PWD:/workspace" \
            -w /workspace \
            ubuntu:24.04 \
            bash -c '
              set -e

              apt-get update

              apt-get install -y \
                build-essential \
                gcc \
                g++ \
                binutils \
                bison \
                gawk \
                gettext \
                texinfo \
                python3 \
                python3-dev \
                perl \
                rsync \
                jq \
                curl \
                wget \
                xz-utils \
                bzip2 \
                patch \
                file \
                make

              echo "=== Build environment ==="
              uname -m
              gcc -dumpmachine

              echo "=== Building glibc ==="
              /workspace/packages/glibc/build.sh
            '

      - name: Verify artifact
        run: |
          ls -lh glibc-2.44-rootfs.tar.xz
          file glibc-2.44-rootfs.tar.xz

      - name: Upload glibc rootfs
        uses: actions/upload-artifact@v4
        with:
          name: glibc-2.44-rootfs
          path: glibc-2.44-rootfs.tar.xz
          if-no-files-found: error
