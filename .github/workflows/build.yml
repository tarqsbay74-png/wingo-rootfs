name: Build Glibc RootFS (aarch64)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-glibc:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            build-essential \
            bison \
            gawk \
            gettext \
            texinfo \
            jq \
            tar \
            xz-utils \
            wget \
            curl \
            patch

      - name: Make build script executable
        run: |
          chmod +x packages/glibc/build.sh

      - name: Execute cross-build script
        working-directory: packages/glibc
        run: |
          ./build.sh

      - name: Upload RootFS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wingo-rootfs-aarch64
          path: packages/glibc/wingo-rootfs-aarch64.tar.xz
          if-no-files-found: error
          retention-days: 7
          
