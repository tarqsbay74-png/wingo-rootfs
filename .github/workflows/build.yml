name: Build glibc

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc \
            g++ \
            binutils \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            make \
            file \
            git \
            wget \
            curl \
            xz-utils \
            bzip2 \
            tar \
            patch \
            sed \
            gawk \
            perl \
            python3 \
            jq \
            gettext \
            texinfo \
            bison \
            flex \
            libgmp-dev \
            libmpfr-dev \
            libmpc-dev \
            linux-libc-dev

      - name: Run build.sh
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload glibc rootfs
        uses: actions/upload-artifact@v4
        with:
          name: glibc-2.44-rootfs
          path: build/glibc-2.44-rootfs.tar.xz
